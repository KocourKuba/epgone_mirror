name: Mirroring Playlists

on:

  workflow_dispatch:
    inputs:
      update_type:
        description: 'Type of update'
        required: false
        default: 'manual'

  schedule:

    - cron: '0 0 */3 * *'

jobs:
  update:
    runs-on: ubuntu-latest


    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Determine update mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.update_type }}" == "manual" ]]; then
            echo "commit_message=Manual update: $(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          else
            echo "commit_message=Automated playlist and icons update" >> $GITHUB_OUTPUT
          fi

      - name: Run playlist processing script

        run: python mirror_playlists.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -A playlists/ img/ img2/

          # Only attempt to commit if there are staged changes
          if ! git diff --cached --quiet; then
            echo "Push changes"
            git commit -m "${{ steps.mode.outputs.commit_message }}"
            git push
          else
            echo "Nothing staged to commit"
          fi
